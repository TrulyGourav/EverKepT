services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: everkept
      POSTGRES_PASSWORD: everkept  # dev only
      POSTGRES_DB: everkept
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U everkept"]
      interval: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: everkept
      MINIO_ROOT_PASSWORD: everkept-dev-only
    ports: ["9000:9000", "9001:9001"]
    volumes: ["miniodata:/data"]

  mailpit:
    image: axllent/mailpit:latest
    ports: ["8025:8025", "1025:1025"]

volumes:
  pgdata:
  miniodata:
